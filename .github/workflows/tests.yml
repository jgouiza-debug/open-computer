name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line entry points
        run: |
          python -m opencomputer.app --help
          python -m opencomputer.mcp --help
          python -m opencomputer.model_client --help
          python -m opencomputer.setup --help
          python -m opencomputer.setup doctor --offline
