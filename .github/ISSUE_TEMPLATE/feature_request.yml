name: Feature request
description: Suggest a focused improvement.
title: '[Feature] '
body:
  - type: textarea
    id: need
    attributes:
      label: What task are you trying to accomplish?
      description: Describe the user need and any current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the platform and how success would be checked.
    validations:
      required: true
