[package]
name = "opencomputer-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
base64 = "=0.22.1"
png = "=0.18.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[profile.release]
lto = "thin"
codegen-units = 1
